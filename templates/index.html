<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Customer AI Segmentation</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-color: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f1f5f9;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-color);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: var(--accent-color);
            font-size: 1.8rem;
            letter-spacing: -0.025em;
        }

        .input-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: #94a3b8;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            padding: 1rem;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 1rem;
        }

        button:hover {
            opacity: 0.9;
        }

        .result-box {
            margin-top: 2rem;
            padding: 1.5rem;
            background-color: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            animation: fadeIn 0.5s ease-out;
        }

        .result-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
        }

        .result-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: white;
            margin: 0.5rem 0 0 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Customer Data</h2>
        <p style="color: #64748b; margin-bottom: 2rem;">Enter customer metrics below to predict their loyalty segment.</p>
        
        <form action="/predict" method="post">
            <div class="input-group">
                <label>Customer Age(18 to 70)</label>
                <input type="number" step="any" name="Age" placeholder="e.g. 15" required>
            </div>

            <div class="input-group">
                <label>Annual Income</label>
                <input type="number" step="any" name="Annual_Income" placeholder="e.g. $50000" required>
            </div>

            <div class="input-group">
                <label>Spending_Score (1-100)</label>
                <input type="number" step="any" name="Spending_Score" placeholder="e.g. 86" required>
            </div>

            <button type="submit">Analyze Customer and predict customer segment</button>
        </form>

        {% if prediction_text %}
        <div class="result-box">
            <div class="result-label">AI Customer Classification</div>
            <div class="result-value">{{ prediction_text }}</div>
        </div>
        {% endif %}
    </div>
</body>
</html>
